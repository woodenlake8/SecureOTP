name: Build privacy-hardened SecureOTP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      
permissions:
  contents: write

      
      
      - name: Set up Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"



      - name: Apply privacy hardening
        run: python3 harden_secureotp.py .
      - name: Show changes and check patch
        run: |
          git diff --check
          git diff --stat
          if git diff -- app/src/main/java/com/otpextractor/gmail/service/OtpListener.kt app/src/main/java/com/otpextractor/gmail/utils/OtpExtractor.kt | grep '^+' | grep -E 'Log\.|println\('; then
            echo 'Unexpected logging added'; exit 1
          fi
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureOTP-hardened-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hardened-latest
          name: SecureOTP Privacy Hardened
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
          make_latest: false
          overwrite_files: true
